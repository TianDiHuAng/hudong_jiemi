<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>文字密室逃脱</title>
<style>
:root{--bg:#EEF1F6;--card:#FFFFFF;--ink:#1B2233;--mute:#5B667D;--line:#D2D9E6;--acc:#3A56A8;--acc2:#3A56A822;--ok:#1E7A4F;--bad:#B3362B;--tint:transparent;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1320;--card:#161D30;--ink:#E3E8F4;--mute:#9AA6C2;--line:#2A3452;--acc:#8FA8F0;--acc2:#8FA8F022;--ok:#5FCB92;--bad:#F07A6E;--tint:transparent;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1320;--card:#161D30;--ink:#E3E8F4;--mute:#9AA6C2;--line:#2A3452;--acc:#8FA8F0;--acc2:#8FA8F022;--ok:#5FCB92;--bad:#F07A6E;--tint:transparent;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.75 "Noto Sans SC","PingFang SC",system-ui,sans-serif}
main{max-width:1060px;margin:0 auto;padding:24px 16px 80px}
h1{font-size:clamp(24px,4.5vw,34px);line-height:1.25;margin:0 0 4px}
.lead{color:var(--mute)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:2px 12px;font-size:13px;color:var(--mute)}
.chip b{color:var(--ink)}
.layout{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:900px){.layout{grid-template-columns:1.6fr 1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.stage{position:relative;overflow:hidden}
.stage::before{content:"";position:absolute;inset:0;background:radial-gradient(420px 200px at 88% -8%,var(--tint),transparent 70%);pointer-events:none}
.stage>*{position:relative}
#room{font-size:24px;font-weight:800;letter-spacing:.02em}
#strip{font-size:26px;letter-spacing:.12em;margin:2px 0 8px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25))}
#desc{border-left:3px solid var(--acc);padding:6px 12px;background:var(--acc2);border-radius:0 8px 8px 0;margin:8px 0 12px}
#log{max-height:220px;overflow-y:auto;margin:0 0 12px;display:flex;flex-direction:column;gap:6px}
#log p{margin:0;font-size:14.5px;color:var(--mute);background:var(--bg);border-radius:8px;padding:5px 10px}
#log p:last-child{color:var(--ink);font-weight:600}
#acts{display:flex;flex-direction:column;gap:6px}
.grp{font-size:13px;color:var(--mute);margin:8px 0 2px;font-weight:700;letter-spacing:.06em}
button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left;transition:border-color .15s,transform .05s}
button:hover{border-color:var(--acc);transform:translateX(2px)}button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#acts button::before{content:"› ";color:var(--acc);font-weight:700}
.pri{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.side .card{padding:12px 14px}
.side h2{font-size:14px;margin:0 0 8px;color:var(--mute);letter-spacing:.08em;display:flex;align-items:center;justify-content:space-between}
.mapreset{font-size:11px;padding:1px 8px;border-radius:6px;color:var(--mute);background:transparent}
.mapreset:hover{color:var(--acc);transform:none}
#inv{display:flex;flex-wrap:wrap;gap:6px}
.tag{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:13.5px;background:var(--bg)}
.tag .em{margin-right:4px}
#map{width:100%;height:auto;touch-action:none}
#map text{font-size:10px;fill:var(--ink);pointer-events:none}
#map .edge{stroke:var(--line);stroke-width:2;pointer-events:none}
#map .edge.cur{stroke:var(--acc);stroke-dasharray:4 3}
#map .node{cursor:grab}
#map .node rect{fill:var(--bg);stroke:var(--line);stroke-width:1.5}
#map .node.vis rect{stroke:var(--acc)}
#map .node.cur rect{fill:var(--acc);stroke:var(--acc)}
#map .node.cur text{fill:#fff;font-weight:700}
#map .node.new rect{stroke-dasharray:4 3}
#map .node.drag rect{stroke-width:2.5}
#veil{position:fixed;inset:0;background:rgba(10,14,24,.78);display:none;align-items:center;justify-content:center;z-index:9}
#veil.show{display:flex}
#veil .panel{background:var(--card);border-radius:16px;padding:36px 44px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#veil .big{font-size:52px;margin-bottom:8px}
#veil .t{font-size:22px;font-weight:800;margin-bottom:6px}
#veil .sub{color:var(--mute);font-size:14px;margin-bottom:16px;line-height:1.9}
#veil button{font-size:16px}
#loader .card{margin-top:16px}
</style>
</head>
<body>
<main>
<h1 id="title">文字密室逃脱</h1>
<p id="intro" class="lead"></p>
<script>window.__GAME__={"title":"三更药对","intro":"三更梆子刚过，师父留话：今夜有人上门取补血汤的药对。可百子柜被人按君臣佐使重新排过，老戥子也拆了件——你得理清斗位、装好戥子，开了后堂药库把药递出去。","start":"hall","rooms":{"hall":{"n":"堂前厅","d":"柜台上戥子拆散了件，算盘边压着处方笺。四条门通向百子柜廊、账房、碾煎房和候诊廊，夜风从门槛缝里往柜底下钻。"},"cabinet":{"n":"百子柜廊","d":"整面墙的百子柜从地排到梁，最高一排四只大斗签着君、臣、佐、使。矮柜上的常用饮片见了底，药香发苦。"},"study":{"n":"账房","d":"账房只点一盏豆油灯。进货账册摊在案上，朱批密密的；一册手抄药性赋压着账角，书页里夹着张折起的字条。"},"work":{"n":"碾煎房","d":"大药碾嵌在青石槽里，碾轮斜卡在槽尾；泥炉上煨着一只药罐，罐口用荷叶封着，药气早散尽了。"},"yard":{"n":"晾药天井","d":"天井里竹匾一层摞一层，晾着切好的饮片。墙根大水缸结着青苔，檐溜滴进石臼，一声一声很慢。"},"porch":{"n":"候诊廊","d":"候诊的长条凳靠墙排开，尽头是后堂药库的门，门鼻上一把黄铜大锁，锁面嵌着两格深浅不一的药槽。"},"store":{"n":"后堂药库","d":"药库高及屋顶，药架分层码着瓷坛与樟木匣。最高一层搁着一只系锦绳的小匣，地面撒的干石灰踩上去簌簌作响。"}},"items":{"beam":"戥子秤杆","pan":"戥子秤盘","bob":"黄铜秤砣","yaodui":"配好的药对"},"puzzles":[{"id":"柜台暗抽","solved":"c_drawer","clue":"c_counter"},{"id":"老戥子复装","solved":"p_scale","clue":"c_drawer"},{"id":"碾槽卡盘","solved":"p_pan","clue":"c_mill"},{"id":"药罐压砣","solved":"p_bob","clue":"c_pot"},{"id":"百子柜辨位","solved":"p_pair","clue":"c_signs"},{"id":"后堂铜锁","solved":"p_door","clue":"c_lock"},{"id":"樟木药匣","solved":"p_take","clue":"c_shelf"}],"acts":[{"id":"look_counter","room":"hall","label":"端详柜台","n":["c_counter"],"eff":{"f":["c_counter"]},"text":"戥子拆成了三截：秤杆收在抽屉里，秤盘和秤砣没了踪影。抽屉缝里露出半截铜杆头。"},{"id":"open_drawer","room":"hall","label":"拉开柜台抽屉","req":{"f":["c_counter"]},"n":["c_drawer"],"eff":{"f":["c_drawer"],"i":["beam"]},"text":"抽屉顺槽滑开，秤杆躺在旧绒布上，两端接扣空着——师父收拾得很仔细。"},{"id":"install_scale","room":"hall","label":"把秤盘秤砣装回秤杆","req":{"i":["beam","pan","bob"]},"n":["p_scale"],"eff":{"f":["p_scale"]},"text":"铜扣咬合，秤盘归位，秤砣麻绳系上杆尾。老戥子提在手里又平又稳，星花在灯下泛着光。"},{"id":"read_rx","room":"hall","label":"读柜台上的处方笺","text":"傍晚留下的：小儿血虚夜惊，用补血汤，明晨复诊再调。笺角盖着泰和堂的朱印。"},{"id":"hall2cab","room":"hall","label":"去百子柜廊","go":"cabinet"},{"id":"cab2hall","room":"cabinet","label":"回堂前厅","go":"hall"},{"id":"hall2study","room":"hall","label":"去账房","go":"study"},{"id":"study2hall","room":"study","label":"回堂前厅","go":"hall"},{"id":"hall2work","room":"hall","label":"去碾煎房","go":"work"},{"id":"work2hall","room":"work","label":"回堂前厅","go":"hall"},{"id":"hall2porch","room":"hall","label":"去候诊廊","go":"porch"},{"id":"porch2hall","room":"porch","label":"回堂前厅","go":"hall"},{"id":"work2yard","room":"work","label":"去晾药天井","go":"yard"},{"id":"yard2work","room":"yard","label":"回碾煎房","go":"work"},{"id":"look_cab","room":"cabinet","label":"端详百子柜","n":["c_signs"],"eff":{"f":["c_signs"]},"text":"最高一排四只大斗的签子写着君、臣、佐、使，纸色雪白，浆糊未干——重排就在这两日内。"},{"id":"amb_cab","room":"cabinet","label":"看矮柜上的饮片","text":"当归、黄芪这些常用饮片一概见了底，难怪师父说单味凑不齐，得成对地配。"},{"id":"pair_ok","room":"cabinet","label":"按推断的位次配出药对","req":{"f":["c_signs","c_ledger","c_note","c_fuzhi","p_scale"]},"n":["p_pair"],"eff":{"f":["p_pair"],"i":["yaodui"]},"text":"你踩上脚凳依次拉开四只高斗：君位是当归，臣位是川芎，佐位是黄芪，使位是甘草——推断与实物一一合上。当归、黄芪各称足份量合进药包，麻绳一勒，药对成了。"},{"id":"pair_w1","room":"cabinet","label":"取君臣两斗配对","req":{"f":["c_signs","c_ledger","c_note","c_fuzhi","p_scale"]},"n":["p_pair"],"text":"两味药末倒上戥盘，气味一个辛窜一个滞重，全然不投——你把药末拨回了原斗。"},{"id":"pair_w2","room":"cabinet","label":"取臣佐两斗配对","req":{"f":["c_signs","c_ledger","c_note","c_fuzhi","p_scale"]},"n":["p_pair"],"text":"戥杆提起来压不平，两味药的成色都对不上补血汤的路数，你摇了摇头。"},{"id":"pair_w3","room":"cabinet","label":"取佐使两斗配对","req":{"f":["c_signs","c_ledger","c_note","c_fuzhi","p_scale"]},"n":["p_pair"],"text":"配出的药对闻着发甜发闷，与笺上所记的药性全然不符，只好作罢。"},{"id":"read_ledger","room":"study","label":"读进货账批注","n":["c_ledger"],"eff":{"f":["c_ledger"]},"text":"账页边有朱笔小字：前夜重排斗签，旧位记不真了，只记得当归那斗紧挨着川芎，当归在左。"},{"id":"read_note","room":"study","label":"抽出账册里的字条","req":{"f":["c_ledger"]},"n":["c_note"],"eff":{"f":["c_note"]},"text":"字条是师父亲笔：三更后有人来取补血汤，当归配黄芪成对，份量称足；重排那晚，甘草仍留在使位没挪。"},{"id":"read_fuzhi","room":"study","label":"读药性赋旁批","n":["c_fuzhi"],"eff":{"f":["c_fuzhi"]},"text":"旁批一行小楷：芪性升补，从来不做头味，排斗时断不居君位。"},{"id":"amb_study","room":"study","label":"挑一挑灯芯","text":"豆油灯结了灯花，挑一挑，账面上的朱批亮了些。"},{"id":"look_mill","room":"work","label":"端详药碾","n":["c_mill"],"eff":{"f":["c_mill"]},"text":"碾轮斜卡在槽尾，轮后沿与槽壁的夹缝里露出半片黄铜圆盘，像是戥子的秤盘。"},{"id":"lift_roller","room":"work","label":"抬起碾轮取秤盘","req":{"f":["c_mill"]},"n":["p_pan"],"eff":{"f":["p_pan"],"i":["pan"]},"text":"双手压住轮轴一撬，碾轮咯吱让开，秤盘从夹缝里滑出来，盘面只蹭花了指甲大的一块。"},{"id":"look_pot","room":"work","label":"端详药罐","n":["c_pot"],"eff":{"f":["c_pot"]},"text":"药罐煨在炉上早凉透了，罐口的荷叶上压着一只黄铜秤砣，麻绳拴在罐耳上。"},{"id":"take_bob","room":"work","label":"揭开药罐取秤砣","req":{"f":["c_pot"]},"n":["p_bob"],"eff":{"f":["p_bob"],"i":["bob"]},"text":"荷叶掀开，药渣干成一块。秤砣上的麻绳还打着活结，解下来正合适。"},{"id":"amb_work","room":"work","label":"闻一闻炉膛","text":"炉膛里积着三日前煎药的苦味，火道早冷了。"},{"id":"amb_yard","room":"yard","label":"翻看竹匾里的饮片","text":"橘皮、麦冬薄薄摊着，竹匾沿上停着一只夜蛾。"},{"id":"look_lock","room":"porch","label":"端详铜锁","n":["c_lock"],"eff":{"f":["c_lock"]},"text":"黄铜大锁横着门鼻，锁面凹成两格药槽：深格槽底錾着君字，浅格錾着佐字，槽口大小恰好容一份药的末子。"},{"id":"press_lock","room":"porch","label":"把药对压进两格药槽","req":{"i":["yaodui"]},"n":["p_door"],"eff":{"f":["p_door"]},"text":"药包解开，当归末压实深槽，黄芪末压实浅槽。锁舌咔地退进锁身，门轴吱呀转开了一条缝。"},{"id":"amb_porch","room":"porch","label":"摸一摸长条凳","text":"凳面被三代人的衣角磨得发亮，晚风把门帘掀了一下。"},{"id":"porch2store","room":"porch","label":"推开药库门","req":{"f":["p_door"]},"go":"store"},{"id":"store2porch","room":"store","label":"回候诊廊","go":"porch"},{"id":"look_shelf","room":"store","label":"端详最高层药架","n":["c_shelf"],"eff":{"f":["c_shelf"]},"text":"最高层搁着一只系锦绳的樟木小匣，匣侧墨字还认得出：交付用，三更。"},{"id":"win_take","room":"store","label":"解开锦绳取出药匣","req":{"i":["yaodui"],"f":["p_door","c_shelf"]},"eff":{"f":["p_take"]},"end":"win","text":"锦绳一抽就开，匣里衬着蜡纸。你把药对包端端正正放进匣里，合盖系绳。叩门声穿过前堂一声紧过一声，你抱着药匣穿过候诊廊迎了出去——这一夜的门，开得有名有姓。"}],"difficulty":{"minSteps":10,"maxSteps":28,"maxBranch":6}};</script>
<div class="chips">
<span class="chip">谜题 <b id="cPuzzle">–</b></span>
<span class="chip">步数 <b id="cSteps">0</b></span>
<span class="chip">物品 <b id="cItems">0</b></span>
</div>
<div class="layout">
<section class="stage card" aria-live="polite">
<div id="room"></div><div id="strip"></div><div id="desc"></div>
<div id="log"></div><div id="acts"></div>

</section>
<aside class="side">
<div class="card"><h2>地 图 <button class="mapreset" id="mapreset">重置布局</button></h2><svg id="map" viewBox="0 0 200 120" aria-label="房间地图"></svg></div>
<div class="card"><h2>物 品</h2><div id="inv"></div></div>
</aside>
</div>
<div id="veil"><div class="panel"><div class="big" id="veilEm"></div><div class="t" id="veilT"></div><div class="sub" id="veilSub"></div><button class="pri" id="veilBtn">再玩一次</button></div></div>
<div id="loader" style="display:none">
<div class="card">
<p>浏览器安全策略阻止了直接读取同目录的 game.json（用 file:// 直接打开时会出现这种情况）。</p>
<p>两种解决方法：</p>
<ol>
<li>用 <code>node build.js game.json</code> 打包成单文件 HTML 后再打开（推荐）；</li>
<li>或点击下方按钮，手动选择本目录中的 game.json 文件。</li>
</ol>
<p><input type="file" accept=".json,application/json" id="pickjson"></p>
</div>
</div>
</main>
<script>
(function(){
var booted=false;
/* —— emoji 关键词典：按房间名+描述 / 物品名自动配场景条与物品图标 —— */

,["电源","🔌"],["电闸","⚡"],["闸","⚡"],["电钮","🔘"],["按钮","🔘"],["电","⚡"],["船","⛵"],["锚","⚓"],["坞","⚓"],["舱","🚢"],["甲板","⚓"],["泊位","⚓"],["码头","⚓"],["货柜","📦"],["车厢","🚃"],["火车","🚂"],["地铁","🚇"],["站台","🚉"],["候车","🚉"],["轨道","🛤️"],["道岔","🛤️"],["信号","🚥"],["桥","🌉"],["塔","🗼"],["灯塔","🗼"],["棚","⛺"],["帐篷","⛺"],["马","🐎"],["貂","🐾"],["兽","🐾"],["豹","🐆"],["鸟","🐦"],["鱼","🐟"],["池","🐟"],["蒸馏","⚗️"],["试管","⚗️"],["煤油","🛢️"],["油","🛢️"],["钟","🕰️"],["表","⌚"],["沙漏","⏳"],["门","🚪"],["灯","💡"],["烛","🕯️"]];
function emojiFor(text,limit){
limit=limit||6;var got=[],seen={};text=String(text||"");
for(var i=0;i<EMO.length&&got.length<limit;i++){var k=EMO[i][0];
if(text.indexOf(k)>-1&&!seen[EMO[i][1]]){seen[EMO[i][1]]=1;got.push(EMO[i][1])}}
if(!got.length)got=["🚪"];return got.join("")}
var PALETTE=["#3A56A8","#7A3AA8","#A83A56","#3AA87A","#A8703A","#2B7A9E","#8A5A2B","#5A6B2B"];
function hash(s){var h=0;s=String(s||"");for(var i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))>>>0}return h}
function boot(G){
if(booted)return;booted=true;
var title=G.title||"文字密室逃脱";
document.title=title;
document.getElementById("title").textContent=title;
document.documentElement.style.setProperty("--acc",PALETTE[hash(title)%PALETTE.length]);
document.documentElement.style.setProperty("--acc2",PALETTE[hash(title)%PALETTE.length]+"22");
var intro=G.intro||"",ip=document.getElementById("intro");
if(intro){ip.textContent=intro}else{ip.style.display="none"}
var S,logEl=document.getElementById("log"),steps=0;
var visited={},edges={};
/* —— 地图布局存档：节点可拖拽，按关卡标题持久化 —— */
var layoutKey="maplayout:"+title,layout={};
try{layout=JSON.parse(localStorage.getItem(layoutKey)||"{}")||{}}catch(e){layout={}}
function saveLayout(){try{localStorage.setItem(layoutKey,JSON.stringify(layout))}catch(e){}}
function has(s,a){var r=a.req||{};return a.room===s.room&&(r.i||[]).every(function(x){return s.i.indexOf(x)>-1})&&(r.f||[]).every(function(x){return s.f.indexOf(x)>-1})&&(a.n||[]).every(function(x){return s.f.indexOf(x)<0})}
function avail(s){return s.end?[]:G.acts.filter(function(a){return has(s,a)})}
function ap(s,a){var e=a.eff||{},i=new Set(s.i),f=new Set(s.f);(e.i||[]).forEach(function(x){i.add(x)});(e.rm||[]).forEach(function(x){i.delete(x)});(e.f||[]).forEach(function(x){f.add(x)});
return{room:a.go||s.room,i:Array.from(i).sort(),f:Array.from(f).sort(),end:a.end||null}}
function key(s){return s.room+"|"+s.i+"|"+s.f+"|"+(s.end||"")}
/* —— 通关时一次性 BFS 求理论最短步数（仅结算展示，不剧透路径） —— */
function shortestSteps(){
try{var s0={room:G.start,i:[],f:[],end:null},K={},Q=[{s:s0,d:0}];
K[key(s0)]=1;
while(Q.length){
if(Q.length>150000)return -1;
var it=Q.shift(),s=it.s;
if(s.end==="win")return it.d;
var as=avail(s);
for(var i=0;i<as.length;i++){var t=ap(s,as[i]),k=key(t);
if(!K[k]){K[k]=1;Q.push({s:t,d:it.d+1})}}}
return -2}catch(e){return -1}}
function say(t){var p=document.createElement("p");p.textContent=t;logEl.appendChild(p);logEl.scrollTop=1e5}
function solvedCount(){return (G.puzzles||[]).filter(function(p){return S.f.indexOf(p.solved)>-1}).length}
function catOf(a){if(a.go)return["🚪 移动"];
if(/^(看|读|翻|查|端详|听|问|搜|找|观察|检查|细看|打量|数|对照|比较|核|掀|望|摸|试|探|拨|闻|敲|点)/.test(a.label||""))return["🔍 查看"];
return["🛠️ 行动"]}
function drawMap(){
var D={},cur=S.room;
Object.keys(visited).forEach(function(r){D[r]=1});
D[cur]=1;
var adj={};
avail(S).forEach(function(a){if(a.go){D[a.go]=1;adj[a.go]=1}});
var edges={};
G.acts.forEach(function(a){if(a.go&&(visited[a.room]&&visited[a.go]))edges[[a.room,a.go].sort().join("|")]=1;
if(a.go&&a.room===cur)edges[[cur,a.go].sort().join("|")]=2});
var ids=Object.keys(D),depth={};
ids.forEach(function(r){depth[r]=-1});
depth[G.start]=0;var q=[G.start];
while(q.length){var r=q.shift();G.acts.forEach(function(a){if(a.go&&a.room===r&&D[a.go]&&depth[a.go]<0){depth[a.go]=depth[r]+1;q.push(a.go)}})}
var byLevel={},maxKnown=-1;
ids.forEach(function(r){if(depth[r]>=0){(byLevel[depth[r]]=byLevel[depth[r]]||[]).push(r);if(depth[r]>maxKnown)maxKnown=depth[r]}});
var unk=ids.filter(function(r){return depth[r]<0});
if(unk.length){Array.prototype.push.apply(byLevel[maxKnown+1]=byLevel[maxKnown+1]||[],unk)}
var levels=Object.keys(byLevel).map(Number).sort(function(a,b){return a-b});
var pos={};levels.forEach(function(d){byLevel[d].sort();byLevel[d].forEach(function(r,i){
pos[r]=layout[r]?{x:layout[r].x,y:layout[r].y}:{x:36+d*78,y:22+i*34}})});
var xs=ids.map(function(r){return pos[r].x}),ys=ids.map(function(r){return pos[r].y});
var W=Math.max(36+(maxKnown+2)*78+6,Math.max.apply(null,xs.concat([200]))+46);
var H=Math.max(22+((levels.length?Math.max.apply(null,levels.map(function(d){return byLevel[d].length})):1)+1)*34,Math.max.apply(null,ys.concat([120]))+34);
var svg=['<svg viewBox="0 0 '+W+" "+H+'" xmlns="http://www.w3.org/2000/svg">'];
Object.keys(edges).forEach(function(k){var p=k.split("|");
if(!pos[p[0]]||!pos[p[1]])return;
svg.push('<line class="edge'+(edges[k]===2?" cur":"")+'" x1="'+pos[p[0]].x+'" y1="'+pos[p[0]].y+'" x2="'+pos[p[1]].x+'" y2="'+pos[p[1]].y+'"/>')});
ids.forEach(function(r){var p=pos[r],cls="node"+(visited[r]?" vis":"")+(r===cur?" cur":"")+(adj[r]&&!visited[r]?" new":"");
var name=(r===cur||visited[r]||adj[r])?(G.rooms[r]?G.rooms[r].n:r):"?";
svg.push('<g class="'+cls+'" data-room="'+r+'"><rect x="'+(p.x-31)+'" y="'+(p.y-12)+'" width="62" height="24" rx="9"/><text x="'+p.x+'" y="'+(p.y+4)+'" text-anchor="middle">'+name.slice(0,6)+"</text></g>")});
svg.push("</svg>");
var m=document.getElementById("map");m.setAttribute("viewBox","0 0 "+W+" "+H);m.innerHTML=svg.join("")}
/* —— 地图节点拖拽（指针事件，布局实时存档） —— */
(function(){
var m=document.getElementById("map"),drag=null;
function svgXY(evt){var pt=m.createSVGPoint();pt.x=evt.clientX;pt.y=evt.clientY;return pt.matrixTransform(m.getScreenCTM().inverse())}
m.addEventListener("pointerdown",function(e){
var t=e.target,g=t&&t.closest?t.closest(".node"):null;if(!g)return;
var id=g.getAttribute("data-room");if(!id)return;
drag={id:id,off:{x:svgXY(e).x-(layout[id]?layout[id].x:0),y:svgXY(e).y-(layout[id]?layout[id].y:0)}};
g.classList.add("drag");try{m.setPointerCapture(e.pointerId)}catch(err){}});
m.addEventListener("pointermove",function(e){
if(!drag)return;
var p=svgXY(e);
layout[drag.id]={x:Math.max(31,Math.round(p.x-drag.off.x)),y:Math.max(12,Math.round(p.y-drag.off.y))};
drawMap()});
function up(){if(!drag)return;drag=null;saveLayout();
document.getElementById("map").querySelectorAll(".node").forEach(function(g){g.classList.remove("drag")})}
m.addEventListener("pointerup",up);m.addEventListener("pointercancel",up)})();
document.getElementById("mapreset").onclick=function(){layout={};saveLayout();drawMap()};
function chips(){document.getElementById("cPuzzle").textContent=(G.puzzles||[]).length?solvedCount()+"/"+G.puzzles.length:"–";
document.getElementById("cSteps").textContent=steps;document.getElementById("cItems").textContent=S.i.length}
function draw(){
document.getElementById("room").textContent=G.rooms[S.room].n;
document.getElementById("strip").textContent=emojiFor(G.rooms[S.room].n+" "+G.rooms[S.room].d);
document.getElementById("desc").textContent=G.rooms[S.room].d;
document.documentElement.style.setProperty("--tint",PALETTE[hash(title+G.rooms[S.room].n)%PALETTE.length]+"1f");
document.getElementById("inv").innerHTML=S.i.length?S.i.map(function(x){var n=G.items[x]||x;return '<span class="tag"><span class="em">'+emojiFor(n,1)+"</span>"+n+"</span>"}).join(""):'<span class="tag">（空手）</span>';
if(S.end){document.getElementById("acts").innerHTML="";
var b=document.createElement("button");b.className="pri";b.textContent=S.end==="win"?"通关！再玩一次":"失败了，重新开始";b.onclick=reset;document.getElementById("acts").appendChild(b);
var sp=S.end==="win"?shortestSteps():null;
document.getElementById("veilEm").textContent=S.end==="win"?"🎉":"🕯️";
document.getElementById("veilT").textContent=S.end==="win"?"通关！":"失败了……";
var sub=S.end==="win"?("本局 "+steps+" 步 · 解开谜题 "+solvedCount()+"/"+(G.puzzles||[]).length+(sp>0?(" · 理论最短 "+sp+" 步"+(steps===sp?" · 完美路线 🏆":steps<=sp+3?" · 干净利落 ⭐":" · 曲径通幽 🧭")):(sp===-1?" · （状态太多，未计算最短步数）":""))):"";
document.getElementById("veilSub").textContent=sub;
document.getElementById("veil").classList.add("show");
chips();drawMap();return}
document.getElementById("veil").classList.remove("show");
var groups={},order=[];
avail(S).forEach(function(a){var c=catOf(a);if(!groups[c[0]]){groups[c[0]]=[];order.push(c[0])}groups[c[0]].push(a)});
var box=document.getElementById("acts");box.innerHTML="";
order.forEach(function(gn){var h=document.createElement("div");h.className="grp";h.textContent=gn;box.appendChild(h);
groups[gn].forEach(function(a){var b=document.createElement("button");b.textContent=a.label;b.onclick=function(){act(a)};box.appendChild(b)})});
chips();drawMap()}
function act(a){var pre=S.room;var t=ap(S,a);S=t;steps++;visited[S.room]=1;
if(pre!==S.room)edges[[pre,S.room].sort().join("|")]=1;
if(a.text)say(a.text);if(a.go)say("—— "+G.rooms[S.room].n+" ——");draw()}
function reset(){S={room:G.start,i:[],f:[],end:null};steps=0;visited={};visited[G.start]=1;edges={};logEl.innerHTML="";
if(intro)say(intro);say(G.rooms[S.room].d);document.getElementById("veil").classList.remove("show");draw()}
document.getElementById("restart").onclick=reset;
document.getElementById("veilBtn").onclick=reset;
reset();
}
if(window.__GAME__){boot(window.__GAME__);return}
fetch("game.json",{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(boot).catch(function(){
var ld=document.getElementById("loader");ld.style.display="block";
document.getElementById("pickjson").addEventListener("change",function(e){
var f=e.target.files[0];if(!f)return;var rd=new FileReader();
rd.onload=function(){try{boot(JSON.parse(rd.result))}catch(err){alert("game.json 解析失败："+err.message)}};
rd.readAsText(f,"utf-8")});
});
})();
</script>
