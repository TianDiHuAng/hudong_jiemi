<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>文字密室逃脱</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E🧩%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#EEF1F6;--card:#FFFFFF;--ink:#1B2233;--mute:#5B667D;--line:#D2D9E6;--acc:#3A56A8;--acc2:#3A56A822;--ok:#1E7A4F;--bad:#B3362B;--tint:transparent;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1320;--card:#161D30;--ink:#E3E8F4;--mute:#9AA6C2;--line:#2A3452;--acc:#8FA8F0;--acc2:#8FA8F022;--ok:#5FCB92;--bad:#F07A6E;--tint:transparent;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1320;--card:#161D30;--ink:#E3E8F4;--mute:#9AA6C2;--line:#2A3452;--acc:#8FA8F0;--acc2:#8FA8F022;--ok:#5FCB92;--bad:#F07A6E;--tint:transparent;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.75 "Noto Sans SC","PingFang SC",system-ui,sans-serif}
main{max-width:1060px;margin:0 auto;padding:24px 16px 80px}
h1{font-size:clamp(24px,4.5vw,34px);line-height:1.25;margin:0 0 4px}
.lead{color:var(--mute)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:2px 12px;font-size:13px;color:var(--mute)}
.chip b{color:var(--ink)}
.layout{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:900px){.layout{grid-template-columns:1.6fr 1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.stage{position:relative;overflow:hidden}
.stage::before{content:"";position:absolute;inset:0;background:radial-gradient(420px 200px at 88% -8%,var(--tint),transparent 70%);pointer-events:none}
.stage>*{position:relative}
#room{font-size:24px;font-weight:800;letter-spacing:.02em}
#strip{font-size:26px;letter-spacing:.12em;margin:2px 0 8px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25))}
#desc{border-left:3px solid var(--acc);padding:6px 12px;background:var(--acc2);border-radius:0 8px 8px 0;margin:8px 0 12px}
#log{max-height:220px;overflow-y:auto;margin:0 0 12px;display:flex;flex-direction:column;gap:6px}
#log p{margin:0;font-size:14.5px;color:var(--mute);background:var(--bg);border-radius:8px;padding:5px 10px}
#log p:last-child{color:var(--ink);font-weight:600}
#acts{display:flex;flex-direction:column;gap:6px}
.grp{font-size:13px;color:var(--mute);margin:8px 0 2px;font-weight:700;letter-spacing:.06em}
button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left;transition:border-color .15s,transform .05s}
button:hover{border-color:var(--acc);transform:translateX(2px)}button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#acts button::before{content:"› ";color:var(--acc);font-weight:700}
.pri{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.side .card{padding:12px 14px}
.side h2{font-size:14px;margin:0 0 8px;color:var(--mute);letter-spacing:.08em;display:flex;align-items:center;justify-content:space-between}
.mapreset{font-size:11px;padding:1px 8px;border-radius:6px;color:var(--mute);background:transparent}
.mapreset:hover{color:var(--acc);transform:none}
.banner{background:var(--acc2);border:1px solid var(--acc);border-radius:8px;padding:4px 10px;font-size:13px;margin:8px 0}
#nudge{font-size:13px}
.chip.link{cursor:pointer;user-select:none}
.chip.link:hover{border-color:var(--acc);color:var(--ink)}
#inv{display:flex;flex-wrap:wrap;gap:6px}
.tag{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:13.5px;background:var(--bg)}
.tag .em{margin-right:4px}
#map{width:100%;height:auto;touch-action:none}
#map text{font-size:10px;fill:var(--ink);pointer-events:none}
#map .edge{stroke:var(--line);stroke-width:2;pointer-events:none}
#map .edge.cur{stroke:var(--acc);stroke-dasharray:4 3}
#map .node{cursor:grab}
#map .node rect{fill:var(--bg);stroke:var(--line);stroke-width:1.5}
#map .node.vis rect{stroke:var(--acc)}
#map .node.cur rect{fill:var(--acc);stroke:var(--acc)}
#map .node.cur text{fill:#fff;font-weight:700}
#map .node.new rect{stroke-dasharray:4 3}
#map .node.drag rect{stroke-width:2.5}
#map .edge.shortest{stroke:var(--ok);stroke-width:3}
#map .rb circle{fill:var(--acc);stroke:var(--bg);stroke-width:1}
#map .rb text{fill:#fff;font-size:9px;font-weight:700}
.maplegend{font-size:12px;color:var(--mute);margin-top:6px;line-height:1.8}
@media(max-width:600px){button{padding:10px 12px}#acts button{min-height:42px}.card{padding:12px}}
#veil{position:fixed;inset:0;background:rgba(10,14,24,.78);display:none;align-items:center;justify-content:center;z-index:9}
#veil.show{display:flex}
#veil .panel{background:var(--card);border-radius:16px;padding:36px 44px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#veil .big{font-size:52px;margin-bottom:8px}
#veil .t{font-size:22px;font-weight:800;margin-bottom:6px}
#veil .sub{color:var(--mute);font-size:14px;margin-bottom:16px;line-height:1.9}
#veil button{font-size:16px}
#loader .card{margin-top:16px}
</style>
</head>
<body>
<main>
<h1 id="title">文字密室逃脱</h1>
<p id="intro" class="lead"></p>
<script>window.__GAME__={"title":"零点自动开播","intro":"你上山检修避雪，却被反锁在这座停播多年的电台里。零点整设备自顾自开了机，大门电吸锁随发射机一起上了电——照老规矩把收播走完，这一夜播完，门才放行。","start":"duty","rooms":{"duty":{"n":"值班室","d":"值班室的灯自顾自亮着，台历翻在停播那天的日期上。桌上摊着值班日志，台历架靠在桌角。"},"lobby":{"n":"门厅","d":"门厅正对玻璃大门，门框上的电吸锁亮着红灯，嗡嗡作响。墙上挂着发报时刻表和全台合影。"},"control":{"n":"播控室","d":"播控台上三路推子标着甲、乙、丙，台沿压着水洇的排播单。监测音箱沙沙响着，正播台里的自动节目。"},"record":{"n":"唱片间","d":"带架一排排立着，台歌带和点播带都在原位，唯独天气旧录的带位空着。桌角搁着一台手摇唱机。"},"mail":{"n":"收发室","d":"分格木架上插着几封来信，格上贴着收件人名条。角落蹲着一只上挂锁的点播木箱。"},"roof":{"n":"天台","d":"天台的雪没过脚踝，天线座拉着斜索，索上结着暗冰。雪地上只有一串旧脚印，到檐口就断了。"},"storage":{"n":"储藏间","d":"储藏间窄得转不开身，架上码着备用话筒和唱针盒，成卷的导线按年月贴着签。"}},"items":{"brass_key":"点播箱铜钥匙","fuse":"备用保险丝","request_card":"山茶花点播卡"},"puzzles":[{"id":"点播木箱","solved":"p_box","clue":"c_locker"},{"id":"带位核对","solved":"p_rack","clue":"c_rack"},{"id":"排播比对","solved":"p_deduce","clue":"c_sched"},{"id":"收播时序","solved":"p_seq","clue":"p_deduce"},{"id":"控台总闸","solved":"p_off","clue":"c_master"},{"id":"大门","solved":"p_door","clue":"c_door"}],"acts":[{"id":"duty2lobby","room":"duty","label":"去门厅","go":"lobby"},{"id":"lobby2duty","room":"lobby","label":"回值班室","go":"duty"},{"id":"duty2control","room":"duty","label":"去播控室","go":"control"},{"id":"control2duty","room":"control","label":"回值班室","go":"duty"},{"id":"duty2mail","room":"duty","label":"去收发室","go":"mail"},{"id":"mail2duty","room":"mail","label":"回值班室","go":"duty"},{"id":"duty2roof","room":"duty","label":"上天台","go":"roof"},{"id":"roof2duty","room":"roof","label":"下天台回值班室","go":"duty"},{"id":"control2record","room":"control","label":"进唱片间","go":"record"},{"id":"record2control","room":"record","label":"回播控室","go":"control"},{"id":"record2storage","room":"record","label":"进储藏间","go":"storage"},{"id":"storage2record","room":"storage","label":"回唱片间","go":"record"},{"id":"read_diary","room":"duty","label":"读桌上的值班日志","n":["c_diary"],"eff":{"f":["c_diary"]},"text":"末页是老葛的笔迹：点播木箱的钥匙照旧搁在台历架后。收播前务必把三路推子走完，总闸留着最后拉。"},{"id":"take_key","room":"duty","label":"从台历架后摸出铜钥匙","req":{"f":["c_diary"]},"n":["f_key"],"eff":{"f":["f_key"],"i":["brass_key"]},"text":"台历架后头果然卡着一把铜钥匙，牌上刻着：点播箱。"},{"id":"look_door","room":"lobby","label":"端详大门的电吸锁","n":["c_door"],"eff":{"f":["c_door"]},"text":"吸锁亮着红灯，随发射机一起上着电——播不停，门就不放。"},{"id":"door_hit","room":"lobby","label":"撞玻璃大门","n":["p_off"],"text":"玻璃震得嗡嗡响，吸锁的红灯闪了闪，门框连缝都没让。"},{"id":"door_pry","room":"lobby","label":"找家伙撬门缝","n":["p_off"],"text":"门缝里探不进半个刀头，吸锁把铁框吸得严丝合缝。"},{"id":"roof_look","room":"roof","label":"看雪地里的旧脚印","text":"脚印是老式翻毛皮鞋底，走到檐口就没了——老葛下山的另一条路，大概不在天台。"},{"id":"roof_lose","room":"roof","label":"踩着天线座的斜索往外挪","end":"lose","text":"斜索结着一层暗冰，挪到一半脚下打滑——脱手的那一瞬，山风把一切都接走了。"},{"id":"look_box","room":"mail","label":"端详点播木箱","n":["c_locker"],"eff":{"f":["c_locker"]},"text":"挂锁不大，锁孔倒规整，牌上刻着点播箱三个字。"},{"id":"open_box","room":"mail","label":"用铜钥匙开点播木箱","req":{"i":["brass_key"]},"n":["p_box"],"eff":{"f":["p_box"],"i":["fuse","request_card"]},"text":"箱里码着一沓点播卡，最上面是山茶花那张；卡下压着一节备用保险丝。"},{"id":"read_letters","room":"mail","label":"把三封来信都拆读一遍","n":["c_letA","c_letB","c_letC"],"eff":{"f":["c_letA","c_letB","c_letC"]},"text":"牧羊人信上说：台歌一完就是天气旧录，最后才是点播，一夜不差。护林员信上说：台歌过了直接点播，天气旧录压轴。兽医站信上说：天气旧录放在最前头，台歌是跟着它才响的。三封信，三种顺序，谁也不让谁。"},{"id":"read_card","room":"mail","label":"读山茶花的点播卡","req":{"i":["request_card"]},"text":"卡上写着：点播《山茶花》，指名零点一刻压轴——落款是山下小学的孩子们。"},{"id":"deduce","room":"mail","label":"拿排播单比对三信与带位","req":{"f":["c_sched","c_letA","c_letB","c_letC","p_rack"]},"n":["p_deduce"],"eff":{"f":["p_deduce"]},"text":"排播单头一行钉死了台歌在零点整，兽医站的信先出局；末一行的压轴是点播，护林员的信也对不上；带架空位证实中段确有天气一段。只剩牧羊人的次序立得住：台歌、天气、点播——页脚写着乙路归余下那段，乙路正是天气。"},{"id":"rack_look","room":"record","label":"端详排带架","n":["c_rack"],"eff":{"f":["c_rack"]},"text":"台歌带和点播带的插签都在，唯独天气旧录那格空着——听完没归位的带子，多半还在播控台上。"},{"id":"rack_check","room":"record","label":"核对排带架的空位","req":{"f":["c_rack"]},"n":["p_rack"],"eff":{"f":["p_rack"]},"text":"顺着插签一格格对下去：台歌在、点播在、天气旧录缺位。中间那段播的就是它。"},{"id":"phonograph","room":"record","label":"摇两下手摇唱机","text":"唱机空转了两圈，唱针抬着，盘面上落了层薄灰。"},{"id":"storage_look","room":"storage","label":"翻看储藏架","text":"备用话筒还裹着防潮纸，唱针盒按粗细分格，签上最旧的年份比台里的开播还早。"},{"id":"read_sched","room":"control","label":"读台沿的排播单","n":["c_sched"],"eff":{"f":["c_sched","c_master"]},"text":"单子洇得只剩三行：零点整台歌；中间一行全花；零点一刻，点播压轴。页脚两行小字：甲路管台歌，丙路管点播，乙路归余下那段；收播走完，方可断电——总闸罩着透明罩。单子背面还画了道箭头：来信别在这儿猜，带回收发室对着带架排。"},{"id":"push_a","room":"control","label":"推起甲路推子","req":{"f":["p_deduce"]},"n":["seq1"],"eff":{"f":["seq1"]},"text":"甲路推子推到头，音箱里的台歌顿时清晰，联动钩咔地进了一格。"},{"id":"push_b","room":"control","label":"推起乙路推子","req":{"f":["seq1"]},"n":["seq2"],"eff":{"f":["seq2"]},"text":"乙路跟着推满，天气旧录接上台歌的尾音，联动钩又进一格。"},{"id":"push_c","room":"control","label":"换上保险丝推丙路推子","req":{"f":["seq2"],"i":["fuse"]},"n":["p_seq"],"eff":{"f":["p_seq"]},"text":"丙路的保险丝屏烧黑了，备用丝咔地卡进屏座，指示灯由红转绿。推子推满，山茶花的前奏刚好接上——三格联动钩走齐，控台深处一声轻响，总闸的透明罩弹开了。"},{"id":"wrong_push","room":"control","label":"不推乙路直接推丙路","req":{"f":["seq1"],"i":["fuse"]},"n":["p_seq"],"text":"丙路刚推到一半，联动钩咔地退回原位——中间那段没能接上，收播程序不认。"},{"id":"master_off","room":"control","label":"拉下控台总闸","req":{"f":["p_seq"]},"n":["p_off"],"eff":{"f":["p_off"]},"text":"总闸拉到底，发射机的余音一层层沉下去，门厅方向的嗡声也停了——吸锁该转绿了。"},{"id":"win","room":"lobby","label":"拉开断电的大门","req":{"f":["p_off"]},"eff":{"f":["p_door"]},"end":"win","text":"吸锁绿灯下，门把手一压就开。山道上的雪没到小腿，回头望，楼顶的红色航标灯灭了——这一夜，是它最后一次自动开播。"}],"difficulty":{"minSteps":10,"maxSteps":28,"maxBranch":6}};</script>

<span class="chip">谜题 <b id="cPuzzle">–</b></span>
<span class="chip">步数 <b id="cSteps">0</b></span>
<span class="chip">物品 <b id="cItems">0</b></span>
<span class="chip link" id="cSound">🔊 音效开</span>
<span class="chip link" id="nudgeChip">🤔 卡住了？</span>
</div>
<div class="layout">
<section class="stage card" aria-live="polite">

</section>
<aside class="side">

</aside>
</div>

<div class="card">
<p>浏览器安全策略阻止了直接读取同目录的 game.json（用 file:// 直接打开时会出现这种情况）。</p>
<p>两种解决方法：</p>
<ol>
<li>用 <code>node build.js game.json</code> 打包成单文件 HTML 后再打开（推荐）；</li>
<li>或点击下方按钮，手动选择本目录中的 game.json 文件。</li>
</ol>
<p><input type="file" accept=".json,application/json" id="pickjson"></p>
</div>
</div>
</main>
<script>
(function(){

function shortestSolve(){
try{var s0={room:G.start,i:[],f:[],end:null},K={},P={},Q=[{s:s0,d:0}];
K[key(s0)]=1;
while(Q.length){
if(Q.length>150000)return{steps:-1,rooms:null};
var it=Q.shift(),s=it.s;
if(s.end==="win"){
var chain=[],k=key(s);
while(k){chain.unshift(s.room);if(!P[k])break;s=P[k].s;k=key(s)}
return{steps:it.d,rooms:chain}}
var as=avail(s);
for(var i=0;i<as.length;i++){var t=ap(s,as[i]),k=key(t);
if(!K[k]){K[k]=1;P[k]={s:s};Q.push({s:t,d:it.d+1})}}}
return{steps:-2,rooms:null}}catch(e){return{steps:-1,rooms:null}}}

order.forEach(function(gn){var h=document.createElement("div");h.className="grp";h.textContent=gn;box.appendChild(h);
groups[gn].forEach(function(a){var b=document.createElement("button");b.textContent=a.label;b.onclick=function(){act(a)};box.appendChild(b)})});
chips();drawMap();
lastActs=avail(S)}
function act(a){var before=solvedCount(),pre=S.room;var t=ap(S,a);S=t;steps++;visited[S.room]=1;tried[a.label]=1;
if(pre!==S.room){edges[[pre,S.room].sort().join("|")]=1;route.push(S.room);sfx("move")}else sfx(catOf(a)[0].indexOf("查看")>-1?"look":"look");
if(solvedCount()>before)sfx("solve");
if(a.text)say(a.text);if(a.go)say("—— "+G.rooms[S.room].n+" ——");draw();persist()}
function reset(){S={room:G.start,i:[],f:[],end:null};steps=0;visited={};visited[G.start]=1;edges={};tried={};route=[G.start];timeAccum=0;lastTick=Date.now();winInfo=null;logEl.innerHTML="";
if(intro)say(intro);say(G.rooms[S.room].d);document.getElementById("veil").classList.remove("show");draw();persist()}
document.getElementById("restart").onclick=reset;
document.getElementById("veilBtn").onclick=reset;
/* —— 续玩：有未完结存档则恢复 —— */
var restored=false,savedState=null;
try{savedState=JSON.parse(localStorage.getItem(saveKey)||"null")}catch(e){}
if(savedState&&savedState.S&&!savedState.S.end&&savedState.S.room&&G.rooms[savedState.S.room]){
S=savedState.S;steps=savedState.steps||0;visited=savedState.visited||{};visited[S.room]=1;edges=savedState.edges||{};tried={};
route=savedState.route||[S.room];timeAccum=savedState.timeAccum||0;lastTick=Date.now();winInfo=null;
logEl.innerHTML="";
(savedState.logs||[]).forEach(function(t){var p=document.createElement("p");p.textContent=t;logEl.appendChild(p)});
banner("已恢复上次进度（第 "+steps+" 步）· 点「重新开始」可从头玩",true);
restored=true;draw()}
if(!restored)reset();
}
if(window.__GAME__){boot(window.__GAME__);return}
fetch("game.json",{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(boot).catch(function(){
var ld=document.getElementById("loader");ld.style.display="block";
document.getElementById("pickjson").addEventListener("change",function(e){
var f=e.target.files[0];if(!f)return;var rd=new FileReader();
rd.onload=function(){try{boot(JSON.parse(rd.result))}catch(err){alert("game.json 解析失败："+err.message)}};
rd.readAsText(f,"utf-8")});
});
})();
</script>
